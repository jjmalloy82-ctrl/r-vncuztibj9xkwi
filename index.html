<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070d18">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DQCX Radar">
  <title>DQCX Radar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <section id="list">
      <header class="top">
        <div class="brand-row">
          <div class="brand">DQCX <span>Radar</span></div>
          <p class="count" id="count" aria-live="polite">—</p>
        </div>
        <p class="tagline">When should we call, and about what.</p>
        <label class="sr-only" for="q">Search campuses</label>
        <input id="q" type="search" placeholder="Search name, city, owner, tenant" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <div class="chips" id="chips" role="toolbar" aria-label="Filters"></div>
        <p class="updated" id="updated">Loading board…</p>
      </header>
      <div id="results"></div>
      <footer class="foot">
        <p id="install-slot"></p>
        <p>Unknowns stay unknown. Source links are public.</p>
      </footer>
    </section>

    <section id="detail" hidden>
      <header class="detail-top">
        <button type="button" class="back" id="back-btn"><span aria-hidden="true">←</span> Board</button>
        <p class="mini-score" id="mini-score"></p>
      </header>
      <div id="detail-body"></div>
    </section>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <h2 id="sheet-title">Region / state</h2>
          <button type="button" class="back" id="sheet-close">Done</button>
        </div>
        <div id="sheet-body"></div>
      </div>
    </div>
  </div>
  <noscript><p class="noscript">DQCX Radar needs JavaScript to read the board.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
